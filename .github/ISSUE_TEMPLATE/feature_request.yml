name: ✨ Feature request
description: Suggest something new
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe your project and the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
